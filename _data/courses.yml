- id: phys121
  title: "PHY 121 — Mechanics"
  description: >
    First course in a three-semester sequence for students in physics, the physical sciences, or engineering.
    Covers motion in one and two dimensions, Newton's laws, work and energy, conservation laws,
    systems of particles, rotations, oscillations, gravity, and thermodynamics.
    Requires prior knowledge of introductory calculus.
  location: "B&L 267"
  custom_text: ""
  lab_ids: [lab01, lab02, lab03, lab04, lab05]

