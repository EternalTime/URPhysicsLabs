- id: lab07
  number: 7
  name: "Electrostatic Potential"
  description: "Use a mechanically-balanced cylindrical capacitor to measure an absolute voltage by two independent methods: a displacement method based on the principle of virtual work, and a null method using calibrated masses. Map equipotential surfaces for two electrode configurations on resistive graphite paper and draw the corresponding electric field lines."
  prelab: "/assets/docs/Lab07-prelab.pdf"
  manual: "/assets/docs/Lab07-manual.pdf"
  postlab: "/assets/docs/Lab07-postlab.pdf"
  full: "/assets/docs/Lab07.pdf"
  setup: "/setup/lab07.html"
  videos:
