- id: lab15
  number: 15
  name: "The Franck-Hertz Experiment"
  description: "Accelerate electrons through argon vapor in a vacuum tube and measure the current at the anode as a function of accelerating voltage, reproducing the landmark 1914 experiment of Franck and Hertz. Identify the periodic current drops caused by inelastic collisions to determine the energy of the first excited state of argon and confirm the discrete nature of atomic energy levels."
  prelab: "/assets/docs/Lab15-prelab.pdf"
  manual: "/assets/docs/Lab15-manual.pdf"
  postlab: "/assets/docs/Lab15-postlab.pdf"
  full: "/assets/docs/Lab15.pdf"
