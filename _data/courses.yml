- id: phys113
  title: "PHY 113 — General Physics I"
  description: >
    First course in a two-semester sequence for students in the life sciences.
    Covers Newtonian mechanics, including Newton's laws, straight-line and circular motion,
    energy, linear and angular momentum, harmonic motion, sound, wave properties, and fluid dynamics.
    Calculus is used as needed.
  location: "B&L 267"
  custom_text: ""
  lab_ids: [lab01, lab02, lab03, lab04, lab05]

