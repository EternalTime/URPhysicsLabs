      url: "https://www.pas.rochester.edu/~physlabs/manuals/IntroToMulti.mp4"

- id: lab10
  number: 10
  name: "Electronic Circuits"
  description: "Use an oscilloscope to study RC circuits, measuring capacitance from the charging and discharging time constant of a capacitor. Then assemble a resonant RLC circuit and identify the resonance frequency as a function of inductance and capacitance."
  prelab: "/assets/docs/Lab10-prelab.pdf"
