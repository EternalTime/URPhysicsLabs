      url: "https://rochester.hosted.panopto.com/Panopto/Pages/Embed.aspx?id=c1073479-d200-499f-ab3b-abfa0161d8dc&autoplay=false&offerviewer=true&showtitle=true&showbrand=false"

- id: lab08
  number: 8
  name: "Electron Beams"
  description: "Inject an electron beam into a uniform magnetic field produced by a pair of Helmholtz coils and observe the resulting circular trajectory due to the Lorentz force. Use the measured radius of curvature and the known field strength to determine e/mₑ, the charge-to-mass ratio of the electron."
  prelab: "/assets/docs/Lab08-prelab.pdf"
  manual: "/assets/docs/Lab08-manual.pdf"
  postlab: "/assets/docs/Lab08-postlab.pdf"
  full: "/assets/docs/Lab08.pdf"
  setup: "/setup/lab08.html"
  videos:
