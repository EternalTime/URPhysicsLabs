- id: phys122
  title: "PHY 122 — Electricity &amp; Magnetism"
  description: >
    Second course in a three-semester sequence for students in physics, the physical sciences, or engineering.
    Covers electrostatics, electrical potential, capacitors, electric fields in matter, circuits,
    magnetostatics, magnetic fields in matter, induction, A.C. circuits, and electromagnetic waves.
    Calculus is used throughout.
  location: "B&L 268"
  custom_text: ""
  lab_ids: [lab06, lab07, lab08, lab09, lab10]

