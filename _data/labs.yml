- id: lab12
  number: 12
  name: "Geometric Optics"
  description: "Verify the thin lens equation by measuring image distances for converging and diverging lenses at various object positions, and characterize the difference between real and virtual images. Use combinations of lenses to construct simple optical systems such as a telescope and a compound microscope, measuring their magnifications."
  prelab: "/assets/docs/Lab12-prelab.pdf"
  manual: "/assets/docs/Lab12-manual.pdf"
  postlab: "/assets/docs/Lab12-postlab.pdf"
  full: "/assets/docs/Lab12.pdf"
  setup: "/setup/lab12.html"
  videos:
    - title: "Prelab Video"
      url: "https://www.youtube.com/embed/8pGCFx-sIUw"

- id: lab13
  number: 13
  name: "Wave Properties of the Electromagnetic Spectrum"
  description: "Observe double-slit and single-slit interference and diffraction patterns using both a helium-neon laser and a microwave source. Measure the fringe spacings to calculate the wavelengths of each source and confirm that wave optics applies across a wide range of the electromagnetic spectrum."
  prelab: "/assets/docs/Lab13-prelab.pdf"
  manual: "/assets/docs/Lab13-manual.pdf"
  postlab: "/assets/docs/Lab13-postlab.pdf"
  full: "/assets/docs/Lab13.pdf"
  setup: "/setup/lab13.html"

- id: lab14
  number: 14
  name: "The Atomic Spectrum of Hydrogen"
  description: "Use a diffraction grating spectrometer to resolve the visible emission lines of atomic hydrogen and measure their wavelengths. Calibrate the spectrometer with a sodium source and verify that the hydrogen wavelengths match the predictions of the Balmer formula, confirming the quantization of atomic energy levels."
  prelab: "/assets/docs/Lab14-prelab.pdf"
  manual: "/assets/docs/Lab14-manual.pdf"
  postlab: "/assets/docs/Lab14-postlab.pdf"
  full: "/assets/docs/Lab14.pdf"
