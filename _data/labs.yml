# Lab definitions — each lab is defined once and referenced by courses.
# prelab/manual/postlab: student-facing PDFs (leave blank if unused)
# full: complete writeup PDF, linked only on the TA/TI page
# setup: TA/TI lab-setup page (leave blank if unused)
# videos: optional list of { title, url }. A url containing .mp4/.webm renders in a native
#   player, anything else renders in an iframe and must be the host's embed URL. Video files
#   are not tracked here (see .gitignore), so point .mp4/.webm at externally hosted media.
#   Omit if none.
# links: optional list of { title, url } for external resource pages. Omit if none.

- id: lab01
  number: 1
  name: "Statistics and Error Propagation"
  description: "Develop familiarity with the statistical tools used to describe experimental data, including mean, standard deviation, and error estimators. Apply these tools to estimate measurement uncertainties and propagate them through derived quantities such as areas and ratios."
  prelab: "/assets/docs/Lab01-prelab.pdf"
  manual: "/assets/docs/Lab01-manual.pdf"
  postlab: "/assets/docs/Lab01-postlab.pdf"
  full: "/assets/docs/Lab01.pdf"
  setup: "/setup/lab01.html"
  videos:
    - title: "Prelab Video"
      url: "https://rochester.hosted.panopto.com/Panopto/Pages/Embed.aspx?id=5bdc1b28-30d1-412a-a76e-ac0500499e6b&autoplay=false&offerviewer=true&showtitle=true&showbrand=false"

- id: lab02
  number: 2
  name: "Gravitational Acceleration"
  description: "Use an Atwood machine to measure the acceleration due to gravity, accounting for systematic effects such as pulley friction and rotational inertia that prevent a direct free-fall measurement. Analyze how these apparatus imperfections propagate into the final result and compare your measurement to the accepted value of g."
  prelab: "/assets/docs/Lab02-prelab.pdf"
  manual: "/assets/docs/Lab02-manual.pdf"
  postlab: "/assets/docs/Lab02-postlab.pdf"
  full: "/assets/docs/Lab02.pdf"
  setup: "/setup/lab02.html"
  videos:
    - title: "Prelab Video"
      url: "https://rochester.hosted.panopto.com/Panopto/Pages/Embed.aspx?id=576777fd-42ed-4ea7-bbf1-ac0500499e9c&autoplay=false&offerviewer=true&showtitle=true&showbrand=false"

- id: lab03
  number: 3
  name: "Conservation of Momentum"
  description: "Verify the conservation of energy and momentum through two independent experiments: elastic and inelastic collisions on a linear track, and the launch of a projectile captured by a ballistic pendulum. Both methods provide an independent estimate of the projectile velocity, allowing direct comparison of results."
  prelab: "/assets/docs/Lab03-prelab.pdf"
  manual: "/assets/docs/Lab03-manual.pdf"
  postlab: "/assets/docs/Lab03-postlab.pdf"
  full: "/assets/docs/Lab03.pdf"
  setup: "/setup/lab03.html"
  videos:
    - title: "Prelab Video"
      url: "https://rochester.hosted.panopto.com/Panopto/Pages/Embed.aspx?id=dd8e6cbc-48de-4f25-8f64-ac05005034e7&autoplay=false&offerviewer=true&showtitle=true&showbrand=false"

- id: lab04
  number: 4
  name: "Moments of Inertia"
  description: "Measure the moment of inertia of three objects about a specified rotational axis using a photogate timer, and verify the parallel axis theorem. In the second part, investigate Hooke's Law by measuring the oscillation period of a spring-mass system as a function of the attached mass."
  prelab: "/assets/docs/Lab04-prelab.pdf"
  manual: "/assets/docs/Lab04-manual.pdf"
  postlab: "/assets/docs/Lab04-postlab.pdf"
  full: "/assets/docs/Lab04.pdf"
  setup: "/setup/lab04.html"
  videos:
    - title: "Prelab Video"
      url: "https://rochester.hosted.panopto.com/Panopto/Pages/Embed.aspx?id=b9766a7f-9b52-40ac-a5d3-ac0500802d2c&autoplay=false&offerviewer=true&showtitle=true&showbrand=false"

- id: lab05
  number: 5
  name: "Thermal and Mechanical Energy"
  description: "Observe the conversion of mechanical energy into heat by turning a crank that drives friction against an aluminum cylinder, and measure the resulting temperature rise of the cylinder. Use these measurements to estimate Joule's constant, the proportionality between Joules and Calories."
  prelab: "/assets/docs/Lab05-prelab.pdf"
  manual: "/assets/docs/Lab05-manual.pdf"
  postlab: "/assets/docs/Lab05-postlab.pdf"
  full: "/assets/docs/Lab05.pdf"
  setup: "/setup/lab05.html"
  videos:
    - title: "Prelab Video"
      url: "https://rochester.hosted.panopto.com/Panopto/Pages/Embed.aspx?id=0dc4dd14-4b16-49da-a81e-ac05008ab0f8&autoplay=false&offerviewer=true&showtitle=true&showbrand=false"

- id: lab06
  number: 6
  name: "Coulomb's Law"
  description: "Verify Coulomb's Law by measuring the electrostatic force between two charged spheres as a function of their separation and charge. Use log-log analysis to confirm the inverse-square dependence and determine the proportionality constant."
  prelab: "/assets/docs/Lab06-prelab.pdf"
  manual: "/assets/docs/Lab06-manual.pdf"
  postlab: "/assets/docs/Lab06-postlab.pdf"
  full: "/assets/docs/Lab06.pdf"
  setup: "/setup/lab06.html"
