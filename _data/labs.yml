      url: "https://rochester.hosted.panopto.com/Panopto/Pages/Embed.aspx?id=55e90526-cc7a-498e-a281-ac05004579eb&autoplay=false&offerviewer=true&showtitle=true&showbrand=false"

- id: lab09
  number: 9
  name: "Superconductivity and Ohm's Law"
  description: "Observe the Meissner Effect by levitating a magnet above a high-temperature superconductor cooled in liquid nitrogen, demonstrating the expulsion of magnetic flux below the critical temperature. In the second part, build and measure simple DC resistive circuits to verify Ohm's Law and explore series and parallel resistance combinations."
  prelab: "/assets/docs/Lab09-prelab.pdf"
  manual: "/assets/docs/Lab09-manual.pdf"
  postlab: "/assets/docs/Lab09-postlab.pdf"
