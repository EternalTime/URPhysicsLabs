- id: lab11
  number: 11
  name: "The Speed of Waves"
  description: "Measure the speed of sound in air by finding the resonant lengths of a closed tube at a known frequency. In the second part, drive standing waves on strings of different linear densities under varying tension, and verify the dependence of wave speed on these parameters."
  prelab: "/assets/docs/Lab11-prelab.pdf"
