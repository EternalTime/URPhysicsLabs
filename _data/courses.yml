- id: phys123
  title: "PHY 123 — Modern Physics"
  description: >
    Third course in a three-semester sequence for students in physics, the physical sciences, or engineering.
    Covers wave motion, physical optics, special relativity, and quantum mechanics, including the
    Schrödinger equation, the hydrogen atom, the uncertainty principle, radioactive transitions,
    statistical mechanics, and selected topics in solid state, nuclear, and particle physics.
  location: "B&L 165"
  custom_text: ""
  lab_ids: [lab11, lab12, lab13, lab14, lab15]

- id: phys141
  title: "PHY 141 — Mechanics"
  description: >
    First course in a three-semester honors sequence for students planning to concentrate in
    physics, astrophysics, or astronomy. Covers the same topics as PHY 121 in greater depth,
    including symmetries, special relativity, Kepler's laws, and thermodynamics.
    Calculus is used throughout.
  location: ""
  custom_text: ""
  lab_ids: []

